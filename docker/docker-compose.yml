version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: videogen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-videogen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: videogen_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: videogen_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-videogen}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-videogen}
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=${USE_CELERY:-true}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-32chars}
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY}
      - AITUNNEL_BASE_URL=${AITUNNEL_BASE_URL:-https://api.aitunnel.ru/v1/}
      - AITUNNEL_MODEL=${AITUNNEL_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - LINK_INGEST_ENABLED=${LINK_INGEST_ENABLED:-true}
      - COBALT_API_URL=${COBALT_API_URL:-}
      - COBALT_API_KEY=${COBALT_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TRENDS_CACHE_HOURS=${TRENDS_CACHE_HOURS:-6}
      - TRENDS_DEFAULT_REGION=${TRENDS_DEFAULT_REGION:-RU}
      - TRENDS_ANALYZE_COST_CREDITS=${TRENDS_ANALYZE_COST_CREDITS:-1}
      - TIKTOK_TRENDS_ENABLED=${TIKTOK_TRENDS_ENABLED:-true}
      - BRAIN_ENABLED=${BRAIN_ENABLED:-true}
      - BRAIN_MAX_RULES=${BRAIN_MAX_RULES:-12}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
      - YTDLP_COOKIES_FROM_BROWSER=${YTDLP_COOKIES_FROM_BROWSER:-}
      - FIRST_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - FIRST_ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      - MEDIA_ROOT=/app/media
      - UPLOAD_DIR=/app/media/uploads
      - GENERATED_DIR=/app/media/generated
    volumes:
      - media_data:/app/media
      - ../backend/secrets:/app/secrets:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker (for background tasks)
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: videogen_celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-videogen}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-videogen}
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-32chars}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY}
      - AITUNNEL_BASE_URL=${AITUNNEL_BASE_URL:-https://api.aitunnel.ru/v1/}
      - AITUNNEL_MODEL=${AITUNNEL_MODEL:-gemini-2.5-flash}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - LINK_INGEST_ENABLED=${LINK_INGEST_ENABLED:-true}
      - COBALT_API_URL=${COBALT_API_URL:-}
      - COBALT_API_KEY=${COBALT_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TRENDS_CACHE_HOURS=${TRENDS_CACHE_HOURS:-6}
      - TRENDS_DEFAULT_REGION=${TRENDS_DEFAULT_REGION:-RU}
      - TRENDS_ANALYZE_COST_CREDITS=${TRENDS_ANALYZE_COST_CREDITS:-1}
      - TIKTOK_TRENDS_ENABLED=${TIKTOK_TRENDS_ENABLED:-true}
      - BRAIN_ENABLED=${BRAIN_ENABLED:-true}
      - BRAIN_MAX_RULES=${BRAIN_MAX_RULES:-12}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
      - YTDLP_COOKIES_FROM_BROWSER=${YTDLP_COOKIES_FROM_BROWSER:-}
      - MEDIA_ROOT=/app/media
      - UPLOAD_DIR=/app/media/uploads
      - GENERATED_DIR=/app/media/generated
    volumes:
      - media_data:/app/media
      - ../backend/secrets:/app/secrets:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: videogen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  default:
    name: videogen_network
